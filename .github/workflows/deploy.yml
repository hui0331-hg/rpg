name: Deploy to GitHub Pages

# 推送到 main 后自动：装依赖 → 跑测试 → 构建 → 发布到 Pages
# 仓库设置里 Pages 的 Source 要选 "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm icons

      # 数值/解析/派发/成就/记忆/周报 148 项 + 渲染 12 项
      # 任何一条挂了就不发布，避免把白屏版本推上线
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
